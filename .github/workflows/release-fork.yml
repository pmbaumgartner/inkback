name: Release fork

on:
  push:
    branches: [main]
    tags: ["v*-pmbaumgartner.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'pmbaumgartner/roughdraft'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Resolve and validate release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          node --input-type=module -e 'import p from "./package.json" with { type: "json" }; if ((process.env.REQUESTED_TAG && process.env.REQUESTED_TAG !== `v${p.version}`) || !/^\d+\.\d+\.\d+-pmbaumgartner\.\d+$/.test(p.version)) throw new Error("Tag does not match fork version");'
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo 'Release already exists; preserving its immutable assets.'
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm install --frozen-lockfile
        if: steps.release.outputs.exists == 'false'
      - run: pnpm check
        if: steps.release.outputs.exists == 'false'
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.release.outputs.exists == 'false'
      - run: pnpm test:smoke
        if: steps.release.outputs.exists == 'false'
      - name: Build and verify the distributable archive
        if: steps.release.outputs.exists == 'false'
        run: |
          mkdir -p release
          npm pack --pack-destination release
          pnpm test:package "$(find release -name '*.tgz' -print -quit)"
          cd release
          sha256sum *.tgz > SHA256SUMS
      - name: Publish checked assets
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'Release already exists; refusing to replace immutable assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/*.tgz release/SHA256SUMS --target "$GITHUB_SHA" --latest --title "Roughdraft $RELEASE_TAG" --generate-notes
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-browser-failure
          path: packages/app/test-results
